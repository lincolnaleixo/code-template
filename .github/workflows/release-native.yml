name: Native builds

on:
  pull_request:
    paths:
      - ".github/workflows/release-native.yml"
      - ".github/workflows/release-please.yml"
      - "release-please-config.json"
      - "version.txt"
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
  workflow_call:
    inputs:
      tag:
        description: Semantic-version tag created by Release Please
        required: true
        type: string
      publish:
        description: Internal publication authorization from Release Please
        required: true
        type: boolean
      api_url:
        description: Public API URL embedded into native builds
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag or blank for the selected ref (verify only)
        required: false
        default: ""
      api_url:
        description: Public API URL embedded into native builds
        required: false
        default: https://api.example.com

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.14
  VITE_API_URL: ${{ inputs.api_url || vars.NATIVE_API_URL || 'https://api.example.com' }}
  VITE_APP_NAME: Matrix Template

jobs:
  desktop:
    name: Tauri ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
      - run: bun ci
      - run: bun run build:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ runner.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Capacitor Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: bun ci
      - run: bun run build:native
      - name: Generate and synchronize Android project
        working-directory: apps/mobile
        run: |
          bunx cap add android
          bunx cap sync android
      - name: Compile debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Capacitor iOS simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run build:native
      - name: Generate and synchronize iOS project
        working-directory: apps/mobile
        run: |
          bunx cap add ios
          bunx cap sync ios
      - name: Compile simulator application
        run: >-
          xcodebuild
          -workspace apps/mobile/ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath apps/mobile/ios/build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package simulator application
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/App.app
          apps/mobile/ios-simulator.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-simulator
          path: apps/mobile/ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  attach-to-release:
    name: Attach native artifacts to GitHub release
    if: inputs.publish == true
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify Release Please publication gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v8
        with:
          path: native-artifacts
      - name: Package and upload native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          for directory in native-artifacts/*; do
            archive="$(basename "$directory").tar.gz"
            tar -czf "$archive" -C "$directory" .
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          done
      - name: Record publication
        run: |
          {
            echo "## Native release"
            echo
            echo "- Tag: ${{ inputs.tag }}"
            echo "- Source: $(git rev-parse HEAD)"
            echo "- Mode: publish after Release Please gate"
          } >> "$GITHUB_STEP_SUMMARY"
