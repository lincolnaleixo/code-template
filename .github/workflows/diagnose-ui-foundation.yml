name: Diagnose UI foundation

on:
  push:
    branches: [feat/ui-foundation-and-docs]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-ui-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Capture validation output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e

          bun ci > diagnostics/01-bun-ci.log 2>&1
          echo $? > diagnostics/01-bun-ci.exit

          if [ "$(cat diagnostics/01-bun-ci.exit)" = "0" ]; then
            bun run template:validate > diagnostics/02-template-validate.log 2>&1
            echo $? > diagnostics/02-template-validate.exit

            bun run lint:ci > diagnostics/03-biome.log 2>&1
            echo $? > diagnostics/03-biome.exit

            bun run generated:check > diagnostics/04-generated.log 2>&1
            echo $? > diagnostics/04-generated.exit

            bun run typecheck > diagnostics/05-typecheck.log 2>&1
            echo $? > diagnostics/05-typecheck.exit

            bun run test:unit > diagnostics/06-unit.log 2>&1
            echo $? > diagnostics/06-unit.exit

            bun run build > diagnostics/07-build.log 2>&1
            echo $? > diagnostics/07-build.exit

            bun run build:native > diagnostics/08-native-build.log 2>&1
            echo $? > diagnostics/08-native-build.exit
          fi

          cat diagnostics/*.exit || true
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: ui-foundation-diagnostics
          path: diagnostics
          retention-days: 1
