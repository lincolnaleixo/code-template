name: Synchronize Bun lockfile

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/sync-bun-lock.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/sync-bun-lock.yml

permissions:
  contents: write

concurrency:
  group: code-template-sync-bun-lock
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  synchronize:
    name: Update lockfile deterministically
    if: github.event_name != 'pull_request' || github.head_ref == 'ci/release-please-gate'
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/release-please-gate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Regenerate lockfile
        run: bun install
      - name: Verify only lockfile changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git status --porcelain | awk '$2 != "bun.lock" {print}')"
          if [ -n "$unexpected" ]; then
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name matrix-template-agent
          git config user.email actions@users.noreply.github.com
          git add bun.lock
          git commit -m "chore(deps): synchronize API Drizzle lockfile"
          git push origin HEAD:ci/release-please-gate
