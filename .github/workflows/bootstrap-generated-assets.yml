name: Bootstrap generated assets

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - run: bun ci
      - run: bun run auth:generate
      - run: bun run db:generate
      - run: bunx biome format --write packages/db/src/auth-schema.ts
      - run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit generated assets
        shell: bash
        run: |
          paths=(packages/db/src/auth-schema.ts packages/db/drizzle apps/desktop/src-tauri/Cargo.lock)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "chore: refresh generated lockfiles and migrations"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
