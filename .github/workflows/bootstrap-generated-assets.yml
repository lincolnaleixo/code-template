name: Bootstrap generated assets

on:
  push:
    branches: [feat/production-template-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run scripts/pin-catalog.ts
      - run: bun install --lockfile-only
      - run: bun run auth:generate
      - name: Package generated assets
        run: tar -czf generated-assets.tar.gz package.json bun.lock packages/db/src/auth-schema.ts
      - uses: actions/upload-artifact@v7
        with:
          name: generated-assets
          path: generated-assets.tar.gz
          retention-days: 1
