name: Bootstrap generated assets

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run scripts/pin-catalog.ts
      - run: bun install --lockfile-only
      - run: bun run auth:generate
      - run: bunx biome format --write package.json packages/db/src/auth-schema.ts
      - name: Commit generated assets
        shell: bash
        run: |
          if git diff --quiet -- package.json bun.lock packages/db/src/auth-schema.ts; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock packages/db/src/auth-schema.ts
          git commit -m "chore: pin dependencies and generate auth schema"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
