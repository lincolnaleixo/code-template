name: Bootstrap generated assets

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run auth:generate
      - run: bun run db:generate
      - run: bunx biome format --write packages/db/src/auth-schema.ts
      - name: Commit generated assets
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- packages/db/src/auth-schema.ts packages/db/drizzle)" ]; then
            echo "Generated database assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/auth-schema.ts packages/db/drizzle
          git commit -m "chore: generate immutable database migrations"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
