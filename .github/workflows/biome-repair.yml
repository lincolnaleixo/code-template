name: Repair Biome baseline

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/biome-repair.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: code-template-biome-repair
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  repair:
    name: Migrate config and apply safe fixes
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/release-please-gate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - name: Migrate Biome configuration
        run: bunx biome migrate --write
      - name: Enable Tailwind CSS syntax and normalize ignored folders
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('biome.json')
          config = json.loads(path.read_text())
          config['$schema'] = 'https://biomejs.dev/schemas/2.5.9/schema.json'
          config.setdefault('css', {}).setdefault('parser', {})['tailwindDirectives'] = True
          includes = config.setdefault('files', {}).setdefault('includes', [])
          replacements = {
              '!**/node_modules/**': '!**/node_modules',
              '!**/dist/**': '!**/dist',
              '!**/.output/**': '!**/.output',
              '!**/target/**': '!**/target',
              '!**/drizzle/meta/**': '!**/drizzle/meta',
              '!apps/mobile/android/**': '!apps/mobile/android',
              '!apps/mobile/ios/**': '!apps/mobile/ios',
          }
          config['files']['includes'] = [replacements.get(item, item) for item in includes]
          path.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Apply safe lint fixes
        shell: bash
        run: bunx biome check --write . || true
      - name: Apply formatter
        run: bunx biome format --write .
      - name: Commit safe mechanical changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name matrix-template-agent
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "chore(quality): migrate Biome and apply safe fixes"
          git push origin HEAD:ci/release-please-gate
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch executable validation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          repos/$GITHUB_REPOSITORY/actions/workflows/pre-public-validation.yml/dispatches
          -f ref=ci/release-please-gate
