name: Inspect generated database drift

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/inspect-generated-artifacts.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/inspect-generated-artifacts.yml

permissions:
  contents: read

concurrency:
  group: code-template-inspect-generated-drift
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  inspect:
    name: Inspect generated schema and migration
    if: github.event_name != 'pull_request' || github.head_ref == 'ci/release-please-gate'
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run auth:generate
      - run: bun run db:generate
      - name: Print generated diff summary and SQL
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DIFF STAT ==='
          git diff --stat
          echo '=== AUTH SCHEMA DIFF ==='
          git diff -- packages/db/src/auth-schema.ts
          echo '=== JOURNAL DIFF ==='
          git diff -- packages/db/drizzle/meta/_journal.json
          echo '=== GENERATED SQL ==='
          for file in packages/db/drizzle/0001_*.sql; do
            [ -f "$file" ] || continue
            echo "--- $file"
            cat "$file"
          done
