name: Probe self-hosted capabilities

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/runner-capability-probe.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/runner-capability-probe.yml

permissions:
  contents: read

jobs:
  linux:
    name: Linux user-space capability inventory
    if: github.event_name != 'pull_request' || github.head_ref == 'ci/release-please-gate'
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 10
    steps:
      - name: Record operating system and available tooling
        shell: bash
        run: |
          set -euo pipefail
          echo '=== identity ==='
          id
          echo '=== operating system ==='
          cat /etc/os-release || true
          echo '=== commands ==='
          for command in apt-get apt-cache dpkg-deb curl tar xz pkg-config docker podman nix nix-shell psql postgres initdb pg_ctl caddy minio chromium chromium-browser google-chrome; do
            printf '%-20s' "$command"
            command -v "$command" || true
          done
          echo '=== selected packages ==='
          apt-cache policy postgresql postgresql-15 postgresql-16 postgresql-17 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev 2>/dev/null || true
