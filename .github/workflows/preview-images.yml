name: Preview container images

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag
        required: false
        default: manual

permissions:
  contents: read

concurrency:
  group: preview-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - component: web
            dockerfile: apps/web/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve preview tag
        id: preview
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ steps.preview.outputs.tag }}
          cache-from: type=gha,scope=preview-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Publish deployment coordinates
        run: |
          {
            echo "### ${{ matrix.component }} preview image"
            echo "\`ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ steps.preview.outputs.tag }}\`"
            echo "Deploy this OCI image with any compatible self-hosted or managed environment."
          } >> "$GITHUB_STEP_SUMMARY"
