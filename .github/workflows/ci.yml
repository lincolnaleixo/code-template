name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: Quality, schema drift and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun ci
      - run: bun run security:hooks:verify
      - run: bun run security:secrets:verify
      - name: Scan every pull-request commit for secrets and unsafe blobs
        if: github.event_name == 'pull_request'
        env:
          SECRET_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
          SECRET_GUARD_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun run security:history "$SECRET_GUARD_BASE" "$SECRET_GUARD_HEAD"
      - name: Scan every pushed commit for secrets and unsafe blobs
        if: github.event_name == 'push'
        env:
          SECRET_GUARD_BASE: ${{ github.event.before }}
          SECRET_GUARD_HEAD: ${{ github.sha }}
        run: bun run security:history "$SECRET_GUARD_BASE" "$SECRET_GUARD_HEAD"
      - run: bun run test:secret-guards
      - run: bun run scripts/test-secret-guard-git-edge-cases.ts
      - run: bun run security:policy
      - run: bun run security:secrets
      - run: bun run template:validate
      - run: bun run workflow:safety
      - run: bun run docs:check
      - run: bun run lint:ci
      - run: bun run generated:check
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: docker compose --profile full --profile observability config --quiet

  build:
    name: Build web, API and native web bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun ci
      - run: bun run build
      - run: bun run build:native
        env:
          VITE_API_URL: https://api.example.com
          VITE_APP_NAME: Matrix Template CI

  consumer:
    name: Fresh template consumer smoke
    runs-on: ubuntu-24.04
    needs: [quality, build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun run test:template-consumer

  integration:
    name: PostgreSQL authentication and authorization integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix -d matrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://matrix:matrix@localhost:5432/matrix
      BETTER_AUTH_SECRET: integration-secret-integration-secret-integration-secret
      BETTER_AUTH_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
      LOG_LEVEL: error
      OTEL_ENABLED: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun ci
      - run: bun run db:migrate
      - run: bun run test:integration

  e2e:
    name: Hardened Docker Compose E2E
    runs-on: ubuntu-24.04
    needs: [quality, build, consumer, integration]
    env:
      E2E_BASE_URL: http://localhost:8080
      BETTER_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-e2e-secret
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun ci
      - name: Start the complete stack
        run: docker compose --profile full up --build -d
      - name: Wait for reverse proxy and database readiness
        shell: bash
        run: |
          for _attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile full ps
          exit 1
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run authenticated browser lifecycle
        run: bun run test:e2e
      - name: Run axe accessibility audit
        run: bun run test:a11y
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color
      - name: Upload browser and accessibility reports
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-reports
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 1
      - name: Stop the stack
        if: always()
        run: docker compose --profile full down -v --remove-orphans
