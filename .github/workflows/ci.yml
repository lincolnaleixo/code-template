name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
      - run: bun install
      - run: bun run typecheck
      - run: bun run test:unit
      - run: docker compose --profile full config --quiet

  build:
    name: Build web, API and native bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
      - run: bun install
      - run: bun run build
      - run: bun run build:native

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix -d matrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://matrix:matrix@localhost:5432/matrix
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
      - run: bun install
      - run: bun run db:generate
      - run: bun run db:migrate
      - run: bun run test:integration

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    needs: [quality, build, integration]
    env:
      E2E_BASE_URL: http://localhost:8080
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
      - run: bun install
      - name: Start the complete stack
        run: docker compose --profile full up --build -d
      - name: Wait for the reverse proxy and database readiness
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile full ps
          exit 1
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: bun run test:e2e
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose --profile full down -v --remove-orphans
