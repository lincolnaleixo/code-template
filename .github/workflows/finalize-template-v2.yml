name: Finalize template v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'chore/finalize-template-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Finalize changelog and agent rules
        run: |
          python <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          if changelog.exists():
              text = changelog.read_text()
          else:
              text = '# Changelog\n\nAll notable changes to this project are documented in this file.\n\n'

          marker = '## [0.3.0] - 2026-08-22'
          if marker not in text:
              entry = '''## [0.3.0] - 2026-08-22

          ### Added

          - Exact Bun dependency catalog, committed lockfile, isolated installs, and Renovate automation.
          - Immutable Drizzle migrations with generated auth schema and migration drift checks.
          - Better Auth sessions, bearer support, organizations, roles, and organization-scoped project authorization.
          - Typed environment validation, framework-independent domain services, structured API errors, and secure native token-store contracts.
          - Structured JSON logs, request IDs, Prometheus metrics, OpenAPI, and optional OpenTelemetry services.
          - Hardened multi-stage containers, dependency-aware Docker Compose profiles, and optional observability infrastructure.
          - Unit, PostgreSQL integration, Playwright E2E, security scanning, container release, preview-image, and native build workflows.
          - Modular feature manifest, agent adaptation rules, comprehensive README, and this changelog.

          ### Changed

          - Replaced public sample user CRUD with an authenticated organization and project flow.
          - Changed deployment migrations to apply committed SQL only.
          - Changed browser API and authentication clients to same-origin by default while requiring explicit native API origins.
          - Pinned runtime, dependency, container, and workflow versions for reproducible builds.

          ### Security

          - Added least-privilege workflows, secret scanning, dependency audit, filesystem and image scanning, SBOM generation, and build provenance.
          - Removed insecure native token persistence fallbacks and added platform secure-storage injection points.

          '''
              insert_at = text.find('## [')
              if insert_at == -1:
                  text = text.rstrip() + '\n\n' + entry
              else:
                  text = text[:insert_at] + entry + text[insert_at:]
              changelog.write_text(text)

          rules = Path('RULES.md')
          if rules.exists():
              rules_text = rules.read_text()
          else:
              rules_text = '# Template rules\n\n'

          rules_marker = '## Agent authority to disable template modules'
          if rules_marker not in rules_text:
              rules_text = rules_text.rstrip() + '''

          ## Agent authority to disable template modules

          A coding agent may disable, replace, or remove any optional module from this template when the project requirements do not justify it. The template is a superset of capabilities, not a requirement to keep every technology. The agent does not need to preserve a module only because it exists in the starter.

          Before disabling a module, the agent must record the project reason and identify dependent modules. The change is complete only after all of the following are handled together:

          1. Set the corresponding feature to `false` in `template.config.ts`, or remove the feature entry when the project has permanently replaced the capability.
          2. Remove implementation code, routes, adapters, generated artifacts, workspace packages, native wrappers, and imports owned only by that feature.
          3. Remove package dependencies, environment variables, Docker services, volumes, ports, healthchecks, release jobs, security jobs, and CI steps that no longer apply.
          4. Remove or rewrite tests and documentation so they describe the resulting project rather than the original superset.
          5. Preserve shared contracts only when another enabled feature still uses them.
          6. Run `bun run check` and the relevant builds and tests for every remaining target.
          7. Update `CHANGELOG.md` when the change affects the reusable template or an established project capability.

          Examples include removing Capacitor and Tauri from a web-only product, removing PostgreSQL and Better Auth from an offline desktop utility, disabling OpenTelemetry export while retaining structured logs and metrics, or replacing MinIO with another S3-compatible implementation.

          An agent must not leave a disabled feature partially wired, silently skip failing checks, or keep dead dependencies for hypothetical future use.
          '''
              rules.write_text(rules_text)

          Path('.github/workflows/bootstrap-generated-assets.yml').unlink(missing_ok=True)
          Path('scripts/pin-catalog.ts').unlink(missing_ok=True)
          PY
      - name: Apply repository formatting
        run: bun run format
      - name: Remove this one-time workflow
        run: rm .github/workflows/finalize-template-v2.yml
      - name: Commit finalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name matrix-template-agent
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "docs: finalize changelog and modular agent rules"
          git push origin HEAD:${{ github.head_ref }}
