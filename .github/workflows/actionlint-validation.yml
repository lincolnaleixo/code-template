name: Validate workflow syntax

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/actionlint-validation.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/actionlint-validation.yml

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    if: github.event_name != 'pull_request' || github.head_ref == 'ci/release-please-gate'
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install and run actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "$base/$archive"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$checksums" \
            "$base/$checksums"
          (
            cd "$RUNNER_TEMP"
            grep " $archive$" "$checksums" | sha256sum --check --strict -
            tar -xzf "$archive" actionlint
          )
          "$RUNNER_TEMP/actionlint" -color
