name: Verify Release Please token

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/verify-release-please-token.yml

permissions:
  contents: read

jobs:
  token:
    name: Authenticate release automation token
    runs-on: ubuntu-24.04
    steps:
      - name: Verify configured token can access the source repository
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not configured."
            exit 1
          fi

          response="$RUNNER_TEMP/release-token-repository.json"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            > "$response"

          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            '.full_name == $repository and .permissions.push == true' \
            "$response" \
            > /dev/null
          echo "Release Please token authentication and repository push access passed."
