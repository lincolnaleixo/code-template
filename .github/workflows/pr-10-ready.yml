name: Mark PR 10 ready

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  mark-ready:
    name: Mark pull request ready for review
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/release-please-gate'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark the trusted pull request ready
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required for the temporary stage transition."
            exit 1
          fi
          response="$(gh api graphql \
            -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }' \
            -F id="$PR_NODE_ID")"
          test "$(jq -r '.data.markPullRequestReadyForReview.pullRequest.number' <<<"$response")" = "10"
          test "$(jq -r '.data.markPullRequestReadyForReview.pullRequest.isDraft' <<<"$response")" = "false"
