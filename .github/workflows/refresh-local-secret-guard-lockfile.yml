name: Refresh local secret guard lockfile

on:
  push:
    branches:
      - feat/local-secret-guards
    paths:
      - package.json
      - .github/workflows/refresh-local-secret-guard-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Update Bun lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/local-secret-guards
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Resolve exact hook dependencies
        env:
          HUSKY: "0"
        run: bun install
      - name: Commit updated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): lock local secret guard tooling"
          git push origin HEAD:feat/local-secret-guards
