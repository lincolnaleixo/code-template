name: User-space PostgreSQL integration

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/user-space-integration.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/user-space-integration.yml

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  PGPORT: 55432
  PGUSER: matrix
  PGDATABASE: matrix
  DATABASE_URL: postgres://matrix@127.0.0.1:55432/matrix
  NODE_ENV: test
  BETTER_AUTH_SECRET: integration-secret-integration-secret-integration-secret
  BETTER_AUTH_URL: http://localhost:3001
  WEB_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000
  AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
  LOG_LEVEL: error
  OTEL_ENABLED: false

jobs:
  integration:
    name: Migrations and authorization on PostgreSQL 15
    if: github.event_name != 'pull_request' || github.head_ref == 'ci/release-please-gate'
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - name: Extract PostgreSQL into an isolated user-space root
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/postgresql-packages"
          pgroot="$RUNNER_TEMP/postgresql-root"
          rm -rf "$package_dir" "$pgroot"
          mkdir -p "$package_dir" "$pgroot"
          cd "$package_dir"
          apt-get download \
            postgresql-15 \
            postgresql-client-15 \
            postgresql-common \
            postgresql-client-common \
            libpq5 \
            libllvm14 \
            libicu72 \
            libxml2 \
            libxslt1.1 \
            liblz4-1 \
            libzstd1 \
            libssl3 \
            libreadline8 \
            libselinux1 \
            libsystemd0
          for package in ./*.deb; do
            dpkg-deb --extract "$package" "$pgroot"
          done
          echo "$pgroot/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"
          {
            echo "PGROOT=$pgroot"
            echo "LD_LIBRARY_PATH=$pgroot/usr/lib/x86_64-linux-gnu:$pgroot/lib/x86_64-linux-gnu"
          } >> "$GITHUB_ENV"
      - name: Initialize an empty PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PGROOT/usr/lib/postgresql/15/bin:$PATH"
          export LD_LIBRARY_PATH="$PGROOT/usr/lib/x86_64-linux-gnu:$PGROOT/lib/x86_64-linux-gnu"
          pgdata="$RUNNER_TEMP/postgresql-data"
          rm -rf "$pgdata"
          initdb \
            --pgdata="$pgdata" \
            --username="$PGUSER" \
            --auth-local=trust \
            --auth-host=trust \
            --locale=C \
            --encoding=UTF8
          pg_ctl \
            --pgdata="$pgdata" \
            --log="$RUNNER_TEMP/postgresql.log" \
            --options="-h 127.0.0.1 -p $PGPORT" \
            start
          createdb --host=127.0.0.1 --port="$PGPORT" --username="$PGUSER" "$PGDATABASE"
          echo "PGDATA=$pgdata" >> "$GITHUB_ENV"
      - name: Apply every committed migration to the empty database
        run: bun run db:migrate
      - name: Run authentication and authorization integration tests
        run: bun run test:integration
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: |
          export PATH="$PGROOT/usr/lib/postgresql/15/bin:$PATH"
          export LD_LIBRARY_PATH="$PGROOT/usr/lib/x86_64-linux-gnu:$PGROOT/lib/x86_64-linux-gnu"
          if [ -n "${PGDATA:-}" ] && [ -f "$PGDATA/postmaster.pid" ]; then
            pg_ctl --pgdata="$PGDATA" --mode=fast stop
          fi
          if [ -f "$RUNNER_TEMP/postgresql.log" ]; then
            cat "$RUNNER_TEMP/postgresql.log"
          fi
