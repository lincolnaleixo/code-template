name: Make source template public

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/publicize-repository.yml

permissions:
  contents: read

concurrency:
  group: code-template-public-visibility
  cancel-in-progress: false

jobs:
  publicize:
    name: Change repository visibility to public
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 10
    env:
      ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
    steps:
      - name: Require administrative credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_TOKEN" || {
            echo "GITHUB_ADMIN_TOKEN is not configured." >&2
            exit 42
          }

      - name: Apply and verify public visibility
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/repository.json \
            --write-out '%{http_code}' \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            --data '{"visibility":"public","is_template":true}')"
          if [ "$status" != "200" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/repository.json').read_text()).get('message', 'Repository update failed.'))
          except Exception:
              print('Repository update failed.')
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          repository = json.loads(Path('/tmp/repository.json').read_text())
          assert repository.get('visibility') == 'public', repository.get('visibility')
          assert repository.get('is_template') is True, repository.get('is_template')
          PY
          {
            echo "## Repository visibility"
            echo
            echo "- Visibility: public"
            echo "- Template repository: true"
          } >> "$GITHUB_STEP_SUMMARY"
