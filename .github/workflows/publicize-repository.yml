name: Make source template public

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/publicize-repository.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/publicize-repository.yml

permissions:
  contents: read

concurrency:
  group: code-template-public-visibility
  cancel-in-progress: false

jobs:
  publicize:
    name: Change repository visibility to public
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'ci/release-please-gate' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 10
    env:
      ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Select an existing administrative credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ADMIN_TOKEN" ]; then
            echo "source=GITHUB_ADMIN_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_TOKEN" ]; then
            echo "source=RELEASE_PLEASE_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "No configured repository credential can request the visibility change." >&2
            exit 42
          fi

      - name: Apply and verify public visibility
        shell: bash
        env:
          TOKEN_SOURCE: ${{ steps.credential.outputs.source }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_SOURCE" = "GITHUB_ADMIN_TOKEN" ]; then
            token="$ADMIN_TOKEN"
          else
            token="$RELEASE_TOKEN"
          fi
          status="$(curl --silent --show-error \
            --output /tmp/repository.json \
            --write-out '%{http_code}' \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            --data '{"visibility":"public","is_template":true}')"
          if [ "$status" != "200" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/repository.json').read_text()).get('message', 'Repository update failed.'))
          except Exception:
              print('Repository update failed.')
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          repository = json.loads(Path('/tmp/repository.json').read_text())
          assert repository.get('visibility') == 'public', repository.get('visibility')
          assert repository.get('is_template') is True, repository.get('is_template')
          PY
          {
            echo "## Repository visibility"
            echo
            echo "- Visibility: public"
            echo "- Template repository: true"
            echo "- Credential source: $TOKEN_SOURCE"
          } >> "$GITHUB_STEP_SUMMARY"
