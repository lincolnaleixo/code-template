name: Synchronize generated database artifacts

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/sync-generated-artifacts.yml

permissions:
  contents: write

concurrency:
  group: code-template-sync-generated-artifacts
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  synchronize:
    name: Generate, format, and commit schema artifacts
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/release-please-gate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run auth:generate
      - run: bun run db:generate
      - run: bunx biome format --write packages/db/src/auth-schema.ts packages/db/drizzle
      - name: Commit synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-template-agent
          git config user.email actions@users.noreply.github.com
          git add packages/db/src/auth-schema.ts packages/db/drizzle
          git commit -m "fix(db): synchronize generated auth schema"
          git push origin HEAD:ci/release-please-gate
