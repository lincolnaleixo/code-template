name: Pre-public security audit

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/pre-public-security-audit.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/pre-public-security-audit.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: pre-public-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Full-history Gitleaks and artifact cleanup
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'ci/release-please-gate' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "$base/$archive"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$checksums" \
            "$base/$checksums"
          (
            cd "$RUNNER_TEMP"
            grep " $archive$" "$checksums" | sha256sum --check --strict -
            tar -xzf "$archive" gitleaks
            chmod +x gitleaks
          )

      - name: Scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json"

      - name: Delete identified historical browser reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact_id in 9464035422 9464176353; do
            status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/artifact-$artifact_id.json" \
              --write-out '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            if [ "$status" != "204" ] && [ "$status" != "404" ]; then
              echo "Unable to delete artifact $artifact_id (HTTP $status)." >&2
              cat "$RUNNER_TEMP/artifact-$artifact_id.json" >&2 || true
              exit 1
            fi
          done

      - name: Record pre-public security evidence
        shell: bash
        run: |
          {
            echo "## Pre-public security audit"
            echo
            echo "- Full reachable Git history scanned with Gitleaks 8.30.1"
            echo "- Identified historical browser reports deleted or already absent"
            echo "- No report or repository secret was uploaded"
          } >> "$GITHUB_STEP_SUMMARY"
