name: Apply targeted quality fixes

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/quality-targeted-fixes.yml

permissions:
  contents: write

concurrency:
  group: code-template-targeted-quality-fixes
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  fix:
    name: Apply reviewed targeted fixes
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/release-please-gate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - name: Apply targeted semantic and suppression changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace(path: str, previous: str, next_value: str) -> None:
              target = Path(path)
              content = target.read_text()
              if previous not in content:
                  raise SystemExit(f'Expected source fragment missing in {path}')
              target.write_text(content.replace(previous, next_value, 1))

          biome = Path('biome.json')
          config = json.loads(biome.read_text())
          config.setdefault('linter', {}).setdefault('rules', {}).setdefault('a11y', {})[
              'noLabelWithoutControl'
          ] = {
              'level': 'error',
              'options': {
                  'inputComponents': ['Checkbox'],
                  'labelComponents': ['Label'],
              },
          }
          biome.write_text(json.dumps(config, indent=2) + '\n')

          replace(
              'scripts/validate-template.ts',
              "if (!section || section.hidden !== true) {",
              "if (section?.hidden !== true) {",
          )

          replace(
              'packages/ui/src/components/avatar.tsx',
              "export function AvatarImage({ className, ...props }: AvatarImageProps) {\n"
              "  return <img className={cn('aspect-square size-full object-cover', className)} {...props} />\n"
              "}",
              "export function AvatarImage({ alt, className, ...props }: AvatarImageProps) {\n"
              "  return <img alt={alt} className={cn('aspect-square size-full object-cover', className)} {...props} />\n"
              "}",
          )

          for path, noun in (
              ('packages/ui/src/components/dialog.tsx', 'dialog'),
              ('packages/ui/src/components/sheet.tsx', 'sheet'),
          ):
              replace(
                  path,
                  "      ref={ref}\n",
                  "      onKeyDown={(event) => {\n"
                  "        if (event.key === 'Escape') onOpenChange(false)\n"
                  "      }}\n"
                  "      ref={ref}\n",
              )

          replace(
              'packages/ui/src/components/label.tsx',
              "export const Label = forwardRef<HTMLLabelElement, LabelProps>(({ className, ...props }, ref) => (\n"
              "  <label\n",
              "export const Label = forwardRef<HTMLLabelElement, LabelProps>(({ className, ...props }, ref) => (\n"
              "  // biome-ignore lint/a11y/noLabelWithoutControl: Generic label forwards htmlFor and accessible children to callers.\n"
              "  <label\n",
          )

          Path('packages/ui/src/components/separator.tsx').write_text(
              "import type { HTMLAttributes } from 'react'\n"
              "import { cn } from '../utils'\n\n"
              "export interface SeparatorProps extends HTMLAttributes<HTMLHRElement> {\n"
              "  orientation?: 'horizontal' | 'vertical'\n"
              "}\n\n"
              "export function Separator({ className, orientation = 'horizontal', ...props }: SeparatorProps) {\n"
              "  return (\n"
              "    <hr\n"
              "      aria-orientation={orientation}\n"
              "      className={cn(\n"
              "        'shrink-0 border-0 bg-border',\n"
              "        orientation === 'horizontal' ? 'h-px w-full' : 'h-full w-px',\n"
              "        className,\n"
              "      )}\n"
              "      {...props}\n"
              "    />\n"
              "  )\n"
              "}\n"
          )

          replace(
              'packages/ui/src/components/tabs.tsx',
              "  return (\n"
              "    <div\n"
              "      aria-labelledby={tabId(context.baseId, value)}\n",
              "  return (\n"
              "    // biome-ignore lint/a11y/noNoninteractiveTabindex: WAI-ARIA tabs recommend focusable panels when content may begin with non-focusable text.\n"
              "    <div\n"
              "      aria-labelledby={tabId(context.baseId, value)}\n",
          )
          PY
      - run: bunx biome check --write .
      - run: bunx biome ci .
      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-template-agent
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix(a11y): align UI primitives with lint contracts"
          git push origin HEAD:ci/release-please-gate
