name: Pre-public executable validation

on:
  push:
    branches:
      - ci/release-please-gate
    paths:
      - .github/workflows/pre-public-validation.yml
      - .github/workflows/release-please.yml
      - biome.json
      - release-please-config.json
      - scripts/**
      - docs/**
      - package.json
      - bun.lock
      - apps/**
      - packages/**
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/pre-public-validation.yml
      - .github/workflows/release-please.yml
      - biome.json
      - release-please-config.json
      - scripts/**
      - docs/**
      - package.json
      - bun.lock
      - apps/**
      - packages/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-template-pre-public-validation-${{ github.sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  VITE_API_URL: https://api.example.com
  VITE_APP_NAME: Matrix Template Pre-public Validation

jobs:
  repository:
    name: Repository checks and builds
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun ci
      - name: Validate template contracts
        run: bun run template:validate
      - name: Validate documentation links
        run: bun run docs:check
      - name: Run Biome CI
        run: bun run lint:ci
      - name: Verify generated schemas are current
        run: bun run generated:check
      - name: Type-check every workspace
        run: bun run typecheck
      - name: Run unit tests with coverage
        run: bun run test:coverage
      - name: Build API and SSR web application
        run: bun run build
      - name: Build shared native web bundle
        run: bun run build:native
      - name: Validate an isolated generated consumer
        run: bun run test:template-consumer

  tauri-linux:
    name: Tauri Linux
    needs: repository
    runs-on: [self-hosted, linux, x64, matrix]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
      - run: bun ci
      - run: bun run build:desktop

  apple-native:
    name: Tauri macOS and Capacitor iOS
    runs-on: [self-hosted, matrix, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bun ci
      - run: bun run build:desktop
      - run: bun run build:native
      - name: Generate and synchronize iOS project
        working-directory: apps/mobile
        run: |
          bunx cap add ios
          bunx cap sync ios
      - name: Compile simulator application
        run: >-
          xcodebuild
          -workspace apps/mobile/ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath apps/mobile/ios/build
          CODE_SIGNING_ALLOWED=NO
          build
