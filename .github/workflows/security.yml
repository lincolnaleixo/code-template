name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.0

jobs:
  open-source-scans:
    name: Audit, secrets and repository scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - name: Audit JavaScript dependencies
        run: bun run security:audit
      - name: Verify Gitleaks fails closed on a known canary
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/gitleaks-canary"
          canary_log="$RUNNER_TEMP/gitleaks-canary.log"
          rm -rf "$canary_dir"
          mkdir -p "$canary_dir"
          printf 'token = "ghp_%s%s"\n' \
            'aBcDeFgHiJkLmNoPqRsT' \
            'uVwXyZ0123456789' \
            > "$canary_dir/canary.txt"

          set +e
          docker run --rm \
            -v "$canary_dir:/canary:ro" \
            "$GITLEAKS_IMAGE" \
            detect --no-git --source /canary/canary.txt --redact --no-banner \
            > "$canary_log" 2>&1
          status=$?
          set -e
          rm -rf "$canary_dir"

          if [ "$status" -eq 0 ]; then
            echo "::error::Gitleaks did not detect the known canary secret."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            cat "$canary_log"
            echo "::error::Gitleaks canary failed with unexpected exit code $status."
            exit 1
          fi
          echo "Gitleaks canary detection passed."
      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner
      - name: Scan source, lockfile and infrastructure
        # Bun audit checks the resolved application graph. Some installed
        # packages also ship unrelated development lockfiles in node_modules.
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          aquasec/trivy:0.70.0
          fs --exit-code 1 --severity HIGH,CRITICAL
          --scanners vuln,secret,misconfig
          --skip-dirs /workspace/node_modules
          /workspace

  container-scan:
    name: Build and scan OCI images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build API image
        run: docker build --target runtime --tag matrix-template-api:security --file apps/api/Dockerfile .
      - name: Build web image
        run: docker build --target runtime --tag matrix-template-web:security --file apps/web/Dockerfile .
      - name: Scan API image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.70.0
          image --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed
          matrix-template-api:security
      - name: Scan web image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.70.0
          image --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed
          matrix-template-web:security

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && (github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  codeql:
    name: CodeQL
    if: github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
