[package]
name = "matrix-template"
version = "0.1.0"
description = "Matrix cross-platform code template"
authors = ["Matrix"]
edition = "2021"

[lib]
name = "matrix_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
