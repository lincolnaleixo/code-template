[package]
name = "matrix-template"
version = "0.3.0"
description = "Matrix cross-platform code template"
authors = ["Matrix"]
edition = "2021"

[lib]
name = "matrix_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
